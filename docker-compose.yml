services:
  # Go toolchain for unit/integration tests, vet, tidy. The image is the
  # toolchain pin — no Go install needed on the host. Integration tests
  # spawn real child processes (the test app), which is why this service
  # has no read_only hardening: the tests exercise process management.
  dev:
    image: golang:1.27-trixie
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  # The same toolchain with systemd as PID 1, for `make test-integration`:
  # liveswap runs apps as transient units under a real systemd user
  # manager, so the integration suite (the runner's own tests plus the
  # caddytest scenarios that deploy a real app) needs one. Privileged +
  # host cgroup namespace + the cgroup mount is the systemd-in-docker
  # recipe that works on cgroup-v2 hosts (GitHub runners, Docker
  # Desktop). Caches are shared with `dev`.
  dev-systemd:
    build:
      context: test/systemd
    image: motel-dev-systemd
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  lint:
    image: golangci/golangci-lint:v2.15.0
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - golangcicache:/root/.cache/golangci-lint

  # Secret scanner for `make secretscan` and CI's gitleaks job. Lives
  # here — not as a raw `docker run` in the workflow — because
  # Dependabot only parses structured fields (compose image: keys,
  # Dockerfile FROMs, go.mod requires, workflow uses:), never shell
  # strings: an image tag inside a run: line is a pin nothing watches,
  # and a secret scanner's value is its rule set staying current.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    volumes:
      - .:/src

  # Packager for the release .deb artifacts (`make package`).
  nfpm:
    image: goreleaser/nfpm:v2.48.0
    working_dir: /src
    volumes:
      - .:/src

  # The usage ledger (`make usage`, .github/scripts/usage.py): reads the
  # Claude Code transcripts from the host read-only and the Actions API
  # with the token make passes in, writes the CSVs under usage/ and
  # docs/footprint.md into the checkout. Stdlib only, so the image is
  # the whole runtime, pinned here where Dependabot watches it.
  usage:
    image: python:3.14-slim
    working_dir: /src
    environment:
      GH_TOKEN:
    volumes:
      - .:/src
      - ${HOME}/.claude/projects:/claude-projects:ro

  # Serves the demo app tarballs (v1, v2, and a broken v3) that the
  # liveswap scenarios deploy through the webhook — standing in for a
  # GitHub or GitLab release asset URL.
  e2e-artifacts:
    build:
      # The repo root, like e2e-motel and e2e-upstream below: the
      # probe release carries liveswap/testdata/sandbox-view.sh, the
      # one view probe, which is embedded by liveswap's own test and so
      # has to live inside that module.
      context: .
      dockerfile: e2e/liveswap/artifacts.Dockerfile

  # The motel product binary under test (built from cmd/motel).
  # This container plays the production VPS: systemd as PID 1 running
  # the packaged motel.service as the motel user; it terminates
  # HTTP, receives deploy webhooks, runs the deployed demo app as a
  # transient unit under the motel user's systemd manager,
  # rate-limits and caches. Privileged + host cgroup namespace + the
  # cgroup mount is the systemd-in-docker recipe (cgroup-v2 hosts).
  # No `image:`, as for e2e-artifacts: compose names the build
  # `<project>-e2e-motel`, so two checkouts running `make e2e` at
  # once each run the binary they built (one shared tag let either's
  # build replace the other's).
  e2e-motel:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    # e2e-token.service mints a local deploy keypair + token into the
    # shared volume before motel starts (no OIDC provider on the
    # offline compose network); the runner reads the token as its
    # deploy bearer. lib.sh + the systemd suite are for `make e2e`'s
    # in-container step.
    volumes:
      - e2e-deploy:/shared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./e2e/lib.sh:/lib.sh:ro
      - ./e2e/liveswap/systemd.sh:/suite-systemd.sh:ro
      - ./e2e/box/apply.sh:/suite-box.sh:ro
      # The box template, whose own commands the box apply suite runs:
      # bin/apply as the workflow does, make secret and the rest as a
      # laptop does.
      - ./examples/box:/template:ro
    depends_on:
      - e2e-artifacts
      - e2e-upstream

  # Stub origin for the penaltybox scenarios: echoes the requested hint
  # level back as the response header. The product image with a
  # different config: the same build as e2e-motel's, from the cache.
  e2e-upstream:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    command: ["/usr/bin/motel", "run", "--config", "/etc/motel/Caddyfile"]
    # Plain `motel run`, not systemd: the image's SIGRTMIN+3 stop
    # signal would be ignored and cost a 10s SIGKILL wait on teardown.
    stop_signal: SIGTERM
    volumes:
      - ./e2e/penaltybox/upstream.Caddyfile:/etc/motel/Caddyfile:ro

  # The backup suite's storage and its box (`make e2e-backup`), apart
  # from the e2e stack above: a backup talks to neither motel nor the
  # apps, and the suite runs as its own CI job. The key is the
  # fixture's, fixed and public; it guards a tmpfs.
  e2e-s3:
    build:
      context: .
      dockerfile: e2e/backup/s3.Dockerfile
    command: ["--auth-key", "AKIDE2EFIXTURE,e2e-fixture-key-not-a-secret"]
    tmpfs:
      - /data

  e2e-backup-box:
    build:
      context: .
      dockerfile: e2e/backup/Dockerfile
      # The binaries `make e2e-backup` builds before it starts the box:
      # build the box through that target, or it gets the last run's.
      additional_contexts:
        bin: ./build/e2e-backup
    # No `image:`, as for e2e-motel: compose names the build per
    # project.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./e2e/lib.sh:/lib.sh:ro
      - ./e2e/backup/lib.sh:/lib-backup.sh:ro
      - ./e2e/backup/tty.sh:/tty.sh:ro
      - ./e2e/backup/setup.sh:/suite-setup.sh:ro
      - ./e2e/backup/run.sh:/suite-backup.sh:ro
      - ./e2e/backup/units.sh:/suite-units.sh:ro
      - ./e2e/backup/status.sh:/suite-status.sh:ro
      - ./e2e/backup/restore.sh:/suite-restore.sh:ro
      - ./e2e/backup/check.sh:/suite-check.sh:ro
    depends_on:
      - e2e-s3

  # Runs both scenario suites; its exit code gates `make e2e`. The
  # merged Caddyfile is mounted so the reload scenario can POST it to
  # the admin API mid-traffic.
  e2e-runner:
    image: curlimages/curl:8.23.0
    depends_on:
      - e2e-motel
    volumes:
      - ./e2e/run.sh:/run.sh:ro
      - ./e2e/lib.sh:/lib.sh:ro
      - ./e2e/liveswap/run.sh:/suite-liveswap.sh:ro
      - ./examples/deno/scripts/deploy.sh:/deploy-example.sh:ro
      - ./examples/node/scripts/deploy.sh:/deploy-node-example.sh:ro
      - ./e2e/liveswap/recovery.sh:/suite-recovery.sh:ro
      - ./e2e/soak.sh:/soak.sh:ro
      - ./e2e/penaltybox/run.sh:/suite-penaltybox.sh:ro
      - ./e2e/Caddyfile:/Caddyfile:ro
      - e2e-deploy:/shared:ro
    entrypoint: ["/bin/sh", "/run.sh"]

volumes:
  gomodcache:
  gobuildcache:
  golangcicache:
  e2e-deploy:
