# CI override: swap the named cache volumes for bind mounts under
# ./.cache, which CI keeps between runs: gomod in one cache for every
# job, gobuild and golangci in a cache a job
# (.github/actions/go-cache).
services:
  dev:
    volumes:
      - .:/src
      - ./.cache/gomod:/go/pkg/mod
      - ./.cache/gobuild:/root/.cache/go-build
  dev-systemd:
    volumes:
      - .:/src
      - ./.cache/gomod:/go/pkg/mod
      - ./.cache/gobuild:/root/.cache/go-build
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  lint:
    volumes:
      - .:/src
      - ./.cache/gomod:/go/pkg/mod
      - ./.cache/gobuild:/root/.cache/go-build
      - ./.cache/golangci:/root/.cache/golangci-lint
