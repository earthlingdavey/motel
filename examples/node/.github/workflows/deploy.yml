# On every push to main: build the executables, publish them as a
# GitHub release, and tell the box to fetch it. No secrets: the
# deploy job mints a short-lived OIDC token that the box's
# `deploy_trust github { … }` block verifies against GitHub's keys.
#
# Three jobs, each with the token its own part needs. The build, which
# runs the repository's code and its tools, reads the repository. The
# release, which runs none of it, writes to it. The deploy, the one
# job that talks to the box, reads it: the box fetches the release
# with that job's token, so no token the box holds can write here.
#
# No file here names the box. Its address is the repository variable
# MOTEL_URL (Settings → Secrets and variables → Actions →
# Variables), and the build's runner is the variable MOTEL_RUNS_ON
# when the default below is not the one the box needs.
name: deploy
on:
  push:
    branches: [main]
  # Run workflow → a version from the releases page: the box relaunches
  # that release from its disk (the `keep` it deployed last stay), through
  # the same health gate and cutover as a deploy. No build, no release.
  # Leave "Use workflow from" on main: the box's deploy_trust pins
  # `claim ref refs/heads/main`, and a run from a tag or branch is a 401.
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to this version (a tag on the releases page)"
        required: true

permissions:
  contents: read

concurrency: deploy # one at a time: a second deploy would get a 409

jobs:
  build:
    if: ${{ !inputs.rollback }}
    # MUST be the box's architecture: the executable is the runner's
    # Node binary. The default is for an amd64 box; for arm64, set the
    # variable MOTEL_RUNS_ON to ubuntu-24.04-arm. A mismatch is refused
    # at deploy time, naming the runs-on label to set.
    runs-on: ${{ vars.MOTEL_RUNS_ON || 'ubuntu-24.04' }}
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      # A repository made from a template runs this workflow as it is
      # created, before the variable can exist: that run stops here,
      # with the one setting it needs, and publishes nothing.
      - name: Check MOTEL_URL is set
        if: ${{ !vars.MOTEL_URL }}
        run: |
          echo "::error title=MOTEL_URL is not set::Add the repository variable MOTEL_URL, the app's webhook on the box (https://deploy.example.com/example, say): Settings → Secrets and variables → Actions → Variables, or gh variable set MOTEL_URL -R $GITHUB_REPOSITORY --body <url>. Then re-run this job, or push."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm run bundle
      # The tarball's digest, taken here before it leaves the runner: the
      # box hashes what it downloads and refuses anything else, so the
      # tarball cannot be swapped between this job and the deploy.
      - id: artifact
        # An assignment, so a sha256sum that fails fails the step (a
        # substitution inside echo would not): an empty digest is no pin.
        run: |
          sha=$(sha256sum app.tar.gz)
          echo "sha256=${sha%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: app.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    outputs:
      # The tag is named here, not by the build, which runs the
      # repository's code: nothing that build runs picks what this
      # job's token writes.
      version: ${{ steps.version.outputs.version }}
      # The asset's API URL, not its public download URL, so a private
      # repo deploys the same way: the box fetches it with the deploy
      # job's own token, and the box's
      # `artifact_allowlist api.github.com/repos/your-org/` admits it.
      asset_url: ${{ fromJSON(steps.release.outputs.assets)[0].url }}
    steps:
      - id: version
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: release
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: app.tar.gz

  deploy:
    needs: [build, release]
    # A push deploys what the release job published; a rollback has no
    # build and no release, and runs this job alone.
    if: ${{ !cancelled() && (inputs.rollback || needs.release.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the token the box fetches the release with
      id-token: write # mint the deploy token
    env:
      # The app's webhook on the box, e.g.
      # https://deploy.example.com/example. A repository variable, not
      # an organization one: it names this one app.
      MOTEL_URL: ${{ vars.MOTEL_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The box fetches the asset with this job's own token, which
      # reads the repository and expires with the job.
      - run: scripts/deploy.sh "$ASSET_URL"
        if: ${{ !inputs.rollback }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ASSET_URL: ${{ needs.release.outputs.asset_url }}
          ARTIFACT_AUTH_HEADER: token ${{ github.token }}
          ARTIFACT_SHA256: ${{ needs.build.outputs.sha256 }}
      - if: ${{ inputs.rollback }}
        run: scripts/deploy.sh --rollback "$ROLLBACK"
        env:
          ROLLBACK: ${{ inputs.rollback }}
