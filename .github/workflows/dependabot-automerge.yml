# Enables GitHub auto-merge on Dependabot PRs for patch/minor updates.
# "Auto-merge" only fires after every REQUIRED status check passes, so
# this is only as safe as the branch ruleset: main must require the
# "ci-ok" check (the aggregate job in ci.yml), and the repo setting
# "Allow auto-merge" must be on. Without those, this workflow
# deliberately has no effect worth trusting.
#
# Only patch and minor updates merge, and only when every update in the
# PR is one: an allow-list. A major, or an update fetch-metadata gives
# no type, stays open for human review. Its update-type output will not
# do for this: for a group it is the highest typed bump and skips an
# untyped one, so a patch beside an untyped update reads as a patch.
# Hence updated-dependencies-json, entry by entry. Dependabot has typed
# a digest-only image refresh (the tag unchanged) semver-patch, so one
# merges; one that came untyped would stay open.
name: dependabot-automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

env:
  # Node actions on the system store; see ci.yml's env.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          if jq -e 'length > 0 and all(.[]; .updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")' <<<"$UPDATES" >/dev/null; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "left for review: not every update is a patch or a minor"
            jq -r '.[] | "\(.dependencyName) \(.prevVersion) -> \(.newVersion): \(if .updateType == "" then "no type" else .updateType end)"' <<<"$UPDATES"
          fi
