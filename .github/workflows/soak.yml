# Leak-hunting soak (~15-20 min): deploy/reload/traffic churn against
# the product binary, then goroutine/fd return-to-baseline assertions.
# Runs per merge to main, so a leak names the commit that introduced
# it instead of a week of them, and weekly as the run that happens
# even when nothing merges.
#
# Deliberately NOT part of ci-ok, and not on pull requests: 20 minutes
# a PR, a paths filter would exclude almost nothing of liveswap/, and
# a non-required red check still reads as blocked and trains people to
# ignore it. Per-merge pinpoints the commit without touching the PR
# checks or Dependabot auto-merge. A red run here means: read the log,
# grab a heap/goroutine profile via the admin API, and treat it as a
# bug report.
name: soak

on:
  push:
    branches: [main]
    # Everything else can change what the soak measures, so this lists
    # only what provably cannot: no build step opens a markdown file
    # (the binaries are built in the dev container, e2e/bin.sh, with
    # the whole checkout mounted, and compile and embed none; the image
    # builds copy named files, and examples/deno and examples/node
    # whole, whose bundle scripts pack named files and no markdown;
    # .dockerignore's *.md keeps the root's out of their context), and a
    # test file is not in the binary. A push is
    # skipped only when EVERY changed file matches. Deliberately not an
    # allowlist of leak-exposed paths — one would have skipped 2 of the
    # last 25 merges while missing the root go.mod (where Caddy, Souin
    # and the cache enter the binary) and the packaged unit's NOFILE.
    paths-ignore:
      - '**.md'
      - '**_test.go'
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      deploys:
        description: "Deploy cycles"
        default: "300"
      reloads:
        description: "Config reloads"
        default: "300"

# Least-privilege token: this workflow only checks out and runs make.
permissions:
  contents: read

# A burst of merges should leave one soak running, not five queued.
# The event is in the key on purpose: the weekly run and a push both
# target main, so a branch-only key would let a merge cancel the
# baseline run mid-flight.
concurrency:
  group: soak-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node actions on the system store; see ci.yml's env.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # GitHub's Ubuntu kernel refuses unprivileged user namespaces to
      # unconfined processes, and the sysctl is not namespaced, so it
      # reaches into the privileged e2e container and the unconditional
      # sandbox refuses to start. Brings the runner in line with a real
      # Debian host; the full note is on the e2e job in ci.yml.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # make soak builds the stack's Go in the dev container, as make
      # e2e does: ci.yml's e2e lanes keep that build's Go cache, and
      # this restores theirs, with the module cache every job restores
      # (.github/actions/go-cache makes the keys; ci.yml's e2e job says
      # why the lanes have one build cache). Restored and never saved,
      # there being no save step here: the soak compiles nothing the
      # lanes do not, and ci.yml's e2e-backup is the one job that saves
      # their cache. On the push that changes go.sum, before it has
      # saved, the restore-key brings the cache of the go.sum before,
      # and only what changed is compiled. With no cache of this Go at
      # all (a new Go's first push), this build is cold, as it was in
      # the image [measured there: 101 to 111 s, two runs of
      # 2026-11-21].
      - uses: ./.github/actions/go-cache
        with:
          build: e2e
      # COMPOSE with the CI file, whose ./.cache binds are what was
      # restored (ci.yml's env says the same).
      - env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
          SOAK_DEPLOYS: ${{ inputs.deploys || '300' }}
          SOAK_RELOADS: ${{ inputs.reloads || '300' }}
        run: make soak COMPOSE="$COMPOSE"
