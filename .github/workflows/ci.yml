# NOT TO MERGE. A measuring branch (measure/ci-options): this file's
# jobs are replaced by jobs that measure options of the CI deep dive
# (research notes, ci-deep-dive/improve/IMPROVE.md), and none of main's
# checks runs. Its on:, concurrency, permissions and env are main's.
#
# Rules every job here keeps: the CA floor step, checkout and
# runner-sample as on main (the runner's CPU model is read from the
# sample: x86 chips differ up to 1.9x on these tests); actions pinned by
# main's SHAs; and NO JOB SAVES A CACHE: every cache step is
# actions/cache/restore with main's keys and restore-keys, so this
# branch can evict nothing of main's (and is option 1's pull-request
# half in action). No go.mod or go.sum is touched. max-parallel and the
# needs chain keep the run at 12 runners at once or fewer: opt2 6,
# e2e-ready 3, and one at a time of cache-sizes (2), lint-one (3),
# e2e-backup (2), e2e-full (3).
#
# What a step's timestamps do not give is printed as lines starting
# "MEASURE " (.github/scripts/zz_measure.sh says each one);
# ci-deep-dive/measure/collect_measure.py reads a run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to a pull request cancels the run of the commit it
# replaced: only the head's result gates a merge, and the replaced run's
# jobs hold runners the newer run's wait for [measured over the 200 PR
# runs to 2026-11-14: 53 overlapped a newer push to their PR; of 15
# sampled each, a run that overlapped one waited a median 808 s for its
# last job to get a runner, against 83 s]. Every other run (a push to
# main, the release's workflow_call) has a group of its own and is
# never cancelled: a group shared by main's pushes would keep one
# pending run and cancel the one before it, so a merge could go untested.
# Called, the run id is release.yml's, so release.yml must never take a
# ci-yml-run- group itself: a caller holding its callee's group waits on
# it for ever. A replaced run's ci-ok still runs (always()) and is red,
# as it must be for a run cancelled by hand or a job timed out.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-yml-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token for every job: the graph only ever reads the
# repo (checkout, caches, artifacts use the runtime token, not this
# one). Jobs that need more must say so at job level.
permissions:
  contents: read

env:
  # Adds the CI override that bind-mounts Go caches under ./.cache so
  # actions/cache can persist them.
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
  # The JavaScript actions (cache, artifacts, dependency-review,
  # fetch-metadata) verify TLS against the root list their Node
  # bundles, which the floor step cannot reach: this puts them on the
  # system store that step keeps current. Replaces the bundled list,
  # where --use-system-ca only adds to it. SSL_CERT_FILE because where
  # a Node build's OpenSSL looks by default is that build's choice.
  # The test job's ca-trust step proves both hold on the runner.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  # Option 2: test-integration out of the series behind make test.
  #   serial             main's test job as it is: the baseline, on the
  #                      same commit and day. Before vet it also times a
  #                      `go mod download` over every module on the
  #                      restored cache (option 5's cost when there is
  #                      nothing to fetch); that step makes the first
  #                      compose run, so the golang image's pull is in
  #                      it and not in vet's seconds.
  #   beside             vet, then make test and make test-integration at
  #                      once in one step, then fuzz-list.
  #   integration-alone  what a cell of its own would be: the restore
  #                      and make test-integration, nothing else.
  # rep first, so the variants and the two architectures alternate
  # through the run and none has an hour of the day to itself.
  opt2:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        rep: [1, 2, 3, 4, 5]
        variant: [serial, beside, integration-alone]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        exclude:
          - variant: integration-alone
            rep: 4
          - variant: integration-alone
            rep: 5
    runs-on: ${{ matrix.runner }}
    name: opt2 ${{ matrix.variant }} (${{ matrix.runner }}, ${{ matrix.rep }})
    timeout-minutes: 45
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - uses: ./.github/actions/ca-trust
      - name: restore test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - name: go mod download, cache warm
        if: matrix.variant == 'serial'
        run: sh .github/scripts/zz_measure.sh moddownload
      - if: matrix.variant != 'integration-alone'
        run: make vet COMPOSE="$COMPOSE"
      - if: matrix.variant == 'serial'
        run: make test COMPOSE="$COMPOSE"
      - name: make test and make test-integration at once
        if: matrix.variant == 'beside'
        run: sh .github/scripts/zz_measure.sh pair
      - if: matrix.variant != 'integration-alone'
        run: make fuzz-list COMPOSE="$COMPOSE"
      - if: matrix.variant != 'beside'
        run: make test-integration COMPOSE="$COMPOSE"

  # Option 1's unknown: what is in each cache family. Each is restored
  # in turn, measured (the restore's seconds are the step's; the action
  # prints the archive's size; zz_measure.sh prints gomod, gobuild and
  # golangci apart, unpacked and as archives) and removed. The lint
  # families are lint-one's.
  cache-sizes:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: cache-sizes (${{ matrix.runner }})
    timeout-minutes: 20
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # go.sum's hash once, before any cache is unpacked: a restored
      # module cache holds go.sum files of its own, which a later
      # hashFiles('**/go.sum') in this job would count.
      - id: sum
        run: echo "hash=${{ hashFiles('**/go.sum') }}" >> "$GITHUB_OUTPUT"
      - name: restore test
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ steps.sum.outputs.hash }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - run: sh .github/scripts/zz_measure.sh drop test
      # The Go in the key, asked of plain `docker compose` before the
      # restore, as main's e2e-backup job asks and for its reasons.
      - id: go
        run: echo "version=$(docker compose run --rm -T --no-deps dev go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore e2e-backup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ steps.sum.outputs.hash }}
          restore-keys: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - run: sh .github/scripts/zz_measure.sh drop e2e-backup
      - name: restore pkg
        if: runner.arch == 'X64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: pkg-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: pkg-${{ runner.os }}-
      - if: runner.arch == 'X64'
        run: sh .github/scripts/zz_measure.sh drop pkg
      - name: restore vuln
        if: runner.arch == 'X64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vuln-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: vuln-${{ runner.os }}-
      - if: runner.arch == 'X64'
        run: sh .github/scripts/zz_measure.sh drop vuln

  # Option 4: one lint job instead of seven. The cache such a job would
  # have is built without saving one: the seven lint-<module> caches are
  # restored in turn, each measured, and merged (Go's module cache, its
  # build cache and golangci-lint's cache name their entries by
  # content, so a union of them is a cache). Then, in steps of their
  # own, what the one job would run: make tidy-check and make lint over
  # every module.
  lint-one:
    needs: [cache-sizes]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: [1, 2, 3]
    runs-on: ubuntu-latest
    name: lint-one (${{ matrix.rep }})
    timeout-minutes: 30
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # go.sum's hash once, before any cache is unpacked: a restored
      # module cache holds go.sum files of its own, which a later
      # hashFiles('**/go.sum') in this job would count.
      - id: sum
        run: echo "hash=${{ hashFiles('**/go.sum') }}" >> "$GITHUB_OUTPUT"
      - name: restore lint-.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-.-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-.-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-.
      - name: restore lint-backups
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-backups-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-backups-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-backups
      - name: restore lint-box
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-box-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-box-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-box
      - name: restore lint-client
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-client-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-client-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-client
      - name: restore lint-liveswap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-liveswap-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-liveswap-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-liveswap
      - name: restore lint-notify
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-notify-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-notify-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-notify
      - name: restore lint-penaltybox
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-penaltybox-${{ runner.os }}-${{ steps.sum.outputs.hash }}
          restore-keys: lint-penaltybox-${{ runner.os }}-
      - run: sh .github/scripts/zz_measure.sh merge lint-penaltybox
      - name: the union, as the one job's cache
        run: sh .github/scripts/zz_measure.sh union
      - run: make tidy-check COMPOSE="$COMPOSE"
      - if: ${{ !cancelled() }}
        run: make lint COMPOSE="$COMPOSE"
      - name: the cache after the one job's work
        if: ${{ !cancelled() }}
        run: sh .github/scripts/zz_measure.sh du family=union-after

  # Option 3, a lane's getting ready with a Go cache restored: the
  # lane's Go build in the dev container on the cache as restored, its
  # images, then the Go build again with nothing changed. No suite.
  # The cache is main's e2e-backup family, the nearest thing there to
  # the one family the option proposes, so the first build is an upper
  # bound: that cache holds moteld's and motel-backup's compiles (made
  # with the same flags), and not the client's, the test app's other
  # architecture, or notify's test binary. The second build is the
  # lower bound: everything in the cache, as after the family's first
  # save.
  e2e-ready:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: [1, 2, 3]
        lane: [e2e, e2e-notify, e2e-metrics]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - lane: e2e
            bin: e2e
            images: e2e-motel e2e-upstream e2e-artifacts
          - lane: e2e-notify
            bin: e2e-notify
            images: e2e-notify-box e2e-artifacts
          - lane: e2e-metrics
            bin: e2e-metrics notify-tests
            images: e2e-metrics-box e2e-artifacts
    runs-on: ${{ matrix.runner }}
    name: e2e-ready ${{ matrix.lane }} (${{ matrix.runner }}, ${{ matrix.rep }})
    timeout-minutes: 30
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # The Go in the key, asked of plain `docker compose` before the
      # restore, as main's e2e-backup job asks and for its reasons.
      - id: go
        run: echo "version=$(docker compose run --rm -T --no-deps dev go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore e2e-backup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - name: the cache as restored
        run: sh .github/scripts/zz_measure.sh du point=restored lane=${{ matrix.lane }}
      - name: Go build, the cache as restored
        run: |
          # shellcheck disable=SC2086 # $COMPOSE is words, as in the Makefile
          sh .github/scripts/zz_measure.sh timed name=bin pass=restored lane=${{ matrix.lane }} -- $COMPOSE run --rm dev sh e2e/bin.sh ${{ matrix.bin }}
      - name: the cache after the build
        run: sh .github/scripts/zz_measure.sh du point=built lane=${{ matrix.lane }}
      - name: image build
        run: |
          # shellcheck disable=SC2086 # $COMPOSE is words, as in the Makefile
          sh .github/scripts/zz_measure.sh timed name=images lane=${{ matrix.lane }} -- env E2E_LANE=${{ matrix.lane }} $COMPOSE build ${{ matrix.images }}
      - name: Go build again, nothing changed
        run: |
          # shellcheck disable=SC2086 # $COMPOSE is words, as in the Makefile
          sh .github/scripts/zz_measure.sh timed name=bin pass=again lane=${{ matrix.lane }} -- $COMPOSE run --rm dev sh e2e/bin.sh ${{ matrix.bin }}

  # main's e2e-backup job, its cache restored and not saved: the
  # reference lane, on the same day.
  e2e-backup:
    needs: [lint-one]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: e2e-backup (${{ matrix.runner }})
    timeout-minutes: 30
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # The Go in the key, asked of plain `docker compose` before the
      # restore, as main's e2e-backup job asks and for its reasons.
      - id: go
        run: echo "version=$(docker compose run --rm -T --no-deps dev go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore e2e-backup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      # main's e2e job says why (the runner's Ubuntu kernel).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make e2e-backup COMPOSE="$COMPOSE"

  # Option 3, the whole lanes: the same restore, then main's make
  # targets and suites, with the Go built in the dev container. Proves
  # the change passes the suites on both architectures, and gives each
  # job's length under the option (with the cache an upper bound, as in
  # e2e-ready).
  e2e-full:
    needs: [e2e-backup]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [e2e, e2e-notify, e2e-metrics]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - lane: e2e-notify
            args: NOTIFY_SPLITS="core reload heartbeat"
    runs-on: ${{ matrix.runner }}
    name: e2e-full ${{ matrix.lane }} (${{ matrix.runner }})
    timeout-minutes: 30
    steps:
      # Before checkout; floor and why: main's ci.yml, the lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # The Go in the key, asked of plain `docker compose` before the
      # restore, as main's e2e-backup job asks and for its reasons.
      - id: go
        run: echo "version=$(docker compose run --rm -T --no-deps dev go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore e2e-backup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      # main's e2e job says why (the runner's Ubuntu kernel).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make ${{ matrix.lane }} COMPOSE="$COMPOSE" ${{ matrix.args }}
