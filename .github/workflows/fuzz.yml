# Weekly fuzzing of the untrusted-input surfaces (artifact tarball
# extraction, path containment, URL redaction, hint-header parsing,
# deploy-token claim matching, webhook request parsing, and the
# client's drawing of a box's text and of the commands it prints).
# Seed corpora already run in every PR via `make test`, and `make
# fuzz-list` there guarantees every target is discovered; this lane
# does real coverage-guided fuzzing. Like soak, deliberately NOT part
# of ci-ok. A failure writes the crashing input to
# <module>/testdata/fuzz/<Target>/ — uploaded below as an artifact —
# commit it there so `make test` replays it deterministically forever.
name: fuzz

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per fuzz target (Go duration)"
        default: "5m"

# Least-privilege token: this workflow only checks out and runs make.
permissions:
  contents: read

env:
  # Node actions on the system store; see ci.yml's env.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Targets run one after another at FUZZTIME each, plus a per-target
    # instrumented build (box's includes Caddy, cold). `make fuzz-list`
    # counts 47: 235m of fuzzing at 5m. The run of 2026-11-16 (about 34
    # targets) took 180m, about 5.3m a target with its build, so 47 come
    # to about 250m, an estimate the first run at 47 measures. A target
    # added costs about 5.3m more: check that make fuzz-list's count x
    # FUZZTIME, plus the builds, still clears this cap.
    timeout-minutes: 270
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # The Go caches: .github/actions/go-cache says what is kept, and
      # that only a run on main saves. This job's build cache also
      # holds the corpus: Go keeps what a fuzz run finds under its
      # build cache (the Makefile's fuzz), and that is the one thing in
      # these caches no run can make again. Hence `corpus`:
      # - every run on main saves, under a key that ends in the run. A
      #   run whose key hit would save nothing of what it found; and
      #   GitHub removes an entry nothing has read for seven days,
      #   which is how far apart the weekly runs are;
      # - when this Go has no entry yet, the newest of another Go is
      #   restored, for its corpus. Its objects go at the first build's
      #   end, where Go trims what nothing read for five days (ci.yml's
      #   e2e job says how that was read).
      # The save is the last step and runs when the run passed, as the
      # cache's own post step did: a run that found a crasher uploads
      # it below and saves no corpus. A run started by hand on another
      # branch restores main's and saves nothing.
      - id: cache
        uses: ./.github/actions/go-cache
        with:
          build: fuzz
          corpus: true
      - env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: make fuzz COMPOSE="$COMPOSE"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/" # any package's, since box keeps its proof core in a subpackage
          if-no-files-found: ignore
      - if: steps.cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.build-path }}
          key: ${{ steps.cache.outputs.build-key }}
