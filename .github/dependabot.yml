# Hands-off dependency updates. The design, together with
# workflows/dependabot-automerge.yml:
#
#   - Grouped PRs (one per ecosystem, not one per dep) so there is
#     never a backlog to triage. Weekly, except gomod, which is checked
#     daily: Caddy is a Go module, and a weekly check added up to 7 days
#     after the cooldown (Caddy v2.11.9 reached us 10 days after release).
#   - A 7-day cooldown on routine version bumps: compromised upstream
#     releases are almost always yanked within days, so waiting is the
#     cheapest supply-chain defense there is. The gomod clock starts at
#     the module proxy's Time, the tagged commit's date, not the GitHub
#     release's publication: a tag on an old commit gets a short
#     cooldown or none, and no default-days can close that. Security
#     updates BYPASS the cooldown and arrive immediately; gomod's are
#     grouped across its directories too (go-security below).
#   - Patch/minor updates auto-merge once the full CI graph (tests,
#     e2e, package install matrix, govulncheck) passes; majors, and
#     an update with no type, stay open for human review.
#
# GitHub-side switches this file cannot set (do once, in repo
# Settings): "Allow auto-merge"; a branch ruleset on main requiring
# the "ci-ok" status check; Dependabot alerts + security updates.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/backups", "/box", "/client", "/liveswap", "/notify", "/penaltybox"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns: ["*"]
      # Security updates are grouped across the same directories (a
      # group takes one applies-to, hence two groups). Ungrouped, each
      # would be a one-directory PR, and the root module (and box,
      # notify, backups and client) replace the sibling modules they
      # import with their local directories: a bump in only one of those
      # can leave an importer's go.mod untidy, which ci.yml's tidy-check
      # fails.
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    # A Dependabot `ignore` here MUST have a matching watch declaring
    # its exit condition in .github/pin-watch.yml — the pin-watch
    # workflow opens an issue when the condition is met, and flags any
    # ignore without a watch. A pin go.mod holds itself (a require at
    # a pseudo-version ahead of the last tag) needs a watch too, one
    # without `ignores`; pin-watch checks the watch against go.mod, but
    # cannot tell such a pin from a version MVS selected, so a pin
    # without a watch is for review to catch.

  - package-ecosystem: github-actions
    # The examples' workflows are SHA-pinned like ours and are
    # copied into other people's repos, so their pins are kept fresh.
    # .github/actions/go-cache is the one local action that uses
    # another: its pin of actions/cache must move with the workflows'
    # (restores in the action, saves in the workflows), and "/" does
    # not reach its file.
    directories: ["/", "/.github/actions/go-cache", "/examples/box", "/examples/deno", "/examples/node"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images (the e2e boxes and what packs the artifacts
  # server's tarballs, the install-test systemd image, the
  # integration-test systemd image, which has the one Go image among
  # them: the e2e images take their binaries built, e2e/bin.sh).
  - package-ecosystem: docker
    directories: ["/e2e", "/e2e/backup", "/e2e/liveswap", "/packaging/test", "/test/systemd"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dockerfiles:
        patterns: ["*"]

  # Image pins in docker-compose.yml (golang toolchain, golangci-lint,
  # gitleaks, nfpm, python, curl). If your GitHub instance predates
  # docker-compose support in Dependabot, delete this block and bump
  # those pins by hand now and then.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
