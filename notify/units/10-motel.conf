# Written by `motel monitor setup` (notify/DESIGN-notify.md, "Packaging and
# setup"), as /etc/systemd/system/prometheus-alertmanager.service.d/10-motel.conf.
# Debian's unit, with its command replaced: socket activation from
# motel-am.socket and no TCP listener in the host's namespace (with the
# store, a second socket in its namespace: 20-motel-metrics.conf, which
# setup --metrics writes), the config motel renders from the
# Caddyfile's monitor block, no cluster gossip (Debian's default listens
# on 0.0.0.0:9094), and the receiver's name on the delivery counters,
# which motel reads to tell which channel failed. /etc/default's ARGS
# (a conffile) is left as the package shipped it.
[Unit]
Requires=motel-am.socket
After=motel-am.socket

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-alertmanager --web.systemd-socket --config.file=/var/lib/motel-notify/alertmanager.yml --storage.path=/var/lib/prometheus/alertmanager --cluster.listen-address= --enable-feature=receiver-name-in-metrics
MemoryMax=128M
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
ReadWritePaths=/var/lib/prometheus/alertmanager
# The notification log and the silences are Alertmanager's alone: Debian
# ships the directory 0755, and a purge and reinstall makes it so again,
# so every start sets it (as root, before the sandbox).
ExecStartPre=+/usr/bin/chmod 0750 /var/lib/prometheus/alertmanager
