# Written by `moteld monitor setup --metrics` (notify/DESIGN-metrics.md, "The shape"),
# as /etc/systemd/system/victoria-metrics.service.d/10-motel.conf.
# Debian's unit, with its command replaced: TCP only inside the
# motel-metrics namespace (the host reaches it through
# /run/motel-metrics/vm.sock, motel-vm.socket), 14 days kept, the scrapes
# of setup's scrape.yml, and memory capped twice, since the store sizes
# its caches from what it can see: MemoryMax= for the cgroup, and
# -memory.allowedBytes for the caches inside it. -search.latencyOffset is
# 5 s, not the 30 s default, which waits out scrapes from many sources:
# motel is the one pusher, and every alert and GET /<app> read waited
# the 30 s (notify/DESIGN-metrics.md, "Rules"). /etc/default's ARGS (a
# conffile) is left as the package shipped it, so an upgrade never asks.
[Unit]
Requires=motel-metrics-netns.service
After=motel-metrics-netns.service

[Service]
ExecStart=
ExecStart=/usr/bin/victoria-metrics -storageDataPath=/var/lib/victoria-metrics -httpListenAddr=127.0.0.1:8428 -retentionPeriod=14d -memory.allowedBytes=96MiB -promscrape.config=/var/lib/motel-metrics/scrape.yml -search.latencyOffset=5s
NetworkNamespacePath=/run/netns/motel-metrics
MemoryMax=256M
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
ReadWritePaths=/var/lib/victoria-metrics
# The series are the store's alone, read by others only through the
# socket: Debian ships the directory 0755, and a purge and reinstall makes
# it so again, so every start sets it (as root, before the sandbox).
ExecStartPre=+/usr/bin/chmod 0750 /var/lib/victoria-metrics
# A store that fails is restarted for good (Debian's unit:
# Restart=on-failure, RestartSec=1, no start limit). These back the
# restarts off from 1 s to 60 s over six steps, and never give up: one
# that could not start cost a fifth of a core in PID 1 and ~420 journal
# lines a second (#470, measured). A connection to vm.sock that starts
# the store ends the wait, as before.
RestartSteps=6
RestartMaxDelaySec=60
# The store's start brings vmalert, which a stop of the store stops (it
# Requires= the store): a start by hand as much as motel's next push
# through motel-vm.socket, which would otherwise leave the rules
# unevaluated. Not Wants=: with the store failing at its start,
# vmalert's failed start asked for the store again at once, past
# RestartSec=, ~60 restarts a second (#470). ExecStartPost= runs once the
# store's process has started (Type=simple), so a start that fails
# before it, or at once, brings nothing back round (measured); as root
# (+), since the store runs as _victoria-metrics. To keep the store
# stopped, stop motel-vm.socket too.
ExecStartPost=-+/usr/bin/systemctl --no-block start motel-vmalert.service
