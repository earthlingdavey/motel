# Written by `motel metrics setup` (notify/DESIGN-metrics.md, "The shape"),
# as /etc/systemd/system/victoria-metrics.service.d/10-motel.conf.
# Debian's unit, with its command replaced: TCP only inside the
# motel-metrics namespace (the host reaches it through
# /run/motel-metrics/vm.sock, motel-vm.socket), 14 days kept, the scrapes
# of setup's scrape.yml, and memory capped twice, since the store sizes
# its caches from what it can see: MemoryMax= for the cgroup, and
# -memory.allowedBytes for the caches inside it. /etc/default's ARGS (a
# conffile) is left as the package shipped it, so an upgrade never asks.
[Unit]
Requires=motel-metrics-netns.service
After=motel-metrics-netns.service
# The store's start brings vmalert with it: a stop of the store stops
# vmalert (it Requires= the store), and motel's next push starts the
# store again through motel-vm.socket, which would otherwise leave the
# rules unevaluated. To keep the store stopped, stop motel-vm.socket too.
Wants=motel-vmalert.service

[Service]
ExecStart=
ExecStart=/usr/bin/victoria-metrics -storageDataPath=/var/lib/victoria-metrics -httpListenAddr=127.0.0.1:8428 -retentionPeriod=14d -memory.allowedBytes=96MiB -promscrape.config=/var/lib/motel-metrics/scrape.yml
NetworkNamespacePath=/run/netns/motel-metrics
MemoryMax=256M
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
ReadWritePaths=/var/lib/victoria-metrics
