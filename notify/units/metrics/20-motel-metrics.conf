# Written by `motel monitor setup --metrics` (notify/DESIGN-metrics.md, "The shape"),
# as /etc/systemd/system/prometheus-alertmanager.service.d/20-motel-metrics.conf.
# Alertmanager's second socket, motel-am-metrics.socket, in the metrics
# namespace. Alertmanager is handed its sockets only when it starts, so:
# After=, so that the socket listens before Alertmanager starts, whatever
# starts it (either socket's first connection, a restart, a boot);
# Wants=, not Requires= or BindsTo=, so that a namespace that fails to
# come up leaves Alertmanager on motel-am.socket alone, and notify
# working (BindsTo= was measured to fail motel-am.socket at its trigger
# limit); PartOf=, so that a stop or restart of the socket (the
# namespace's stop or restart does that) stops or restarts Alertmanager,
# or it would keep a listener in a namespace that is gone. A start of
# the namespace restarts a running Alertmanager that lacks this socket
# (motel-metrics-netns.service's ExecStartPost=).
[Unit]
Wants=motel-am-metrics.socket
After=motel-am-metrics.socket
PartOf=motel-am-metrics.socket
